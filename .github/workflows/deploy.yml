name: Deploy to GitHub Pages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Create version folder
        run: |
          mkdir -p ./${{ github.event.release.tag_name }}
          cp -r *.html ./${{ github.event.release.tag_name }}/
          cp -r ru/ ./${{ github.event.release.tag_name }}/
          cp -r en/ ./${{ github.event.release.tag_name }}/
          cp .nojekyll ./${{ github.event.release.tag_name }}/
          echo "Version ${{ github.event.release.tag_name }} prepared"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
